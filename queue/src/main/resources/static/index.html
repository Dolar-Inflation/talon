<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Очереди тикетов</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; gap: 30px; }
        .column {
            width: 30%;
        }
        h2 { margin-bottom: 10px; }
        .ticket {
            border: 1px solid #ccc;
            padding: 10px;
            margin: 5px 0;
            background: #f9f9f9;
        }
        #processBtn {
            margin-top: 15px;
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        #processBtn:hover {
            background: #45a049;
        }
    </style>
</head>
<body>

<div class="column">
    <h2>Очередь 1 (SERVER)</h2>
    <div id="queue1"></div>
</div>

<div class="column">
    <h2>Очередь 2 (PC)</h2>
    <div id="queue2"></div>
</div>

<div class="column">
    <h2>Очередь 3 (INTERNET)</h2>
    <div id="queue3"></div>
</div>

<button id="processBtn" onclick="processTicket()">Обработан</button>

<!-- SockJS + STOMP -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>

<script>
    // загрузка очередей при открытии страницы
    fetch('http://localhost:8082/queue')
        .then(response => response.json())
        .then(data => renderQueues(data));

    const socket = new SockJS('http://localhost:8082/ws');
    const stompClient = Stomp.over(socket);

    stompClient.connect({}, () => {
        console.log("Connected to WebSocket");
        stompClient.subscribe('/queue/tickets', (message) => {
            const data = JSON.parse(message.body);
            renderQueues(data);
        });
    });

    function renderQueues(data) {
        renderQueue("queue1", data.queue1);
        renderQueue("queue2", data.queue2);
        renderQueue("queue3", data.queue3);
    }

    function renderQueue(elementId, tickets) {
        const container = document.getElementById(elementId);
        container.innerHTML = "";

        tickets.forEach(ticket => {
            const div = document.createElement("div");
            div.className = "ticket";
            div.innerHTML = `
                <strong>Queue #:</strong> ${ticket.queueNumber}<br>
                <strong>ID:</strong> ${ticket.id}<br>
                <strong>Service:</strong> ${ticket.serviceType}<br>
                <strong>Priority:</strong> ${ticket.emergencyType}
            `;
            container.appendChild(div);
        });
    }

    // Кнопка "Обработан"
    function processTicket() {
        fetch('http://localhost:8082/exec', {
            method: 'POST',
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ serviceType: "SERVER" }) // пример
        }).then(() => {
            console.log("Ticket processed");
        });
    }
</script>

</body>
</html>
