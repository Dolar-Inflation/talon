<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Очередь тикетов</title>
    <style>
        body { font-family: Arial, sans-serif; }
        #tickets { margin-top: 20px; }
        .ticket {
            border: 1px solid #ccc;
            padding: 10px;
            margin: 5px 0;
            background: #f9f9f9;
        }
        #processBtn {
            margin-top: 15px;
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        #processBtn:hover {
            background: #45a049;
        }
    </style>
</head>
<body>

<h2>Очередь тикетов (Live)</h2>

<button id="processBtn" onclick="processTicket()">Обработан</button>

<div id="tickets"></div>

<!-- SockJS + STOMP -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>

<script>
    // загрузка списка при открытии страницы
    fetch('http://localhost:8082/queue')
        .then(response => response.json())
        .then(tickets => renderTickets(tickets));

    const socket = new SockJS('http://localhost:8082/ws');
    const stompClient = Stomp.over(socket);

    stompClient.connect({}, () => {
        console.log("Connected to WebSocket");
        stompClient.subscribe('/queue/tickets', (message) => {
            const tickets = JSON.parse(message.body);
            renderTickets(tickets);
        });
    });

    function renderTickets(tickets) {
        const container = document.getElementById("tickets");
        container.innerHTML = "";
        tickets.forEach(ticket => {
            const div = document.createElement("div");
            div.className = "ticket";
            div.innerHTML = `
                <strong>Queue #:</strong> ${ticket.queueNumber}<br>
                <strong>ID:</strong> ${ticket.id}<br>
                <strong>Service:</strong> ${ticket.serviceType}<br>
                <strong>Priority:</strong> ${ticket.emergencyType}
            `;
            container.appendChild(div);
        });
    }


    // Кнопка "Обработан" вызывает /exec
    function processTicket() {
        fetch('http://localhost:8082/exec', {
            method: 'POST'
        }).then(() => {
            console.log("Ticket processed");
        });
    }
</script>

</body>
</html>
